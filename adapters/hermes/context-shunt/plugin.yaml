name: context-shunt
version: "1.1.0"
description: >-
  Read-only context shunt. Blocks oversized full reads before they run and answers
  questions about large sources with a configurable reader model, returning a bounded,
  citation-verified envelope instead of the file. Exhausted or malformed reader outcomes
  automatically fall back to a labelled deterministic escape hatch - an exact-text prefix,
  or a broader ported legacy-shaped compaction - never a raw payload. Adds a zero-model
  exact inspector under a cumulative disclosure ceiling, a read-only session accounting
  view, an opt-in boundary that adopts oversized tool-result artifacts an external producer
  already persisted, and an opt-in, operator-attested oversized-tool-result capture hook.
  Registers no writer tool. Every disclosure is capped per page and counted against
  cumulative per-source and per-session budgets, so a large payload cannot be reassembled;
  a source small enough to fit those budgets can still be returned in full by the inspector.
author: context-shunt contributors
kind: standalone
# Every tool the adapter registers, so an operator can audit the surface from the
# manifest alone. Read-only by construction: no writer tool is registered or declared.
# context_shunt_import is registered only when artifact_import is configured and the
# capability probe supports it; it is declared here so the surface stays auditable from
# the manifest whether or not a given deployment turns it on.
provides_tools:
  - context_shunt_read
  - context_shunt_inspect
  - context_shunt_stats
  - context_shunt_import
