[pytest]
testpaths = packages/core-py/tests
pythonpath = packages/core-py/src packages/core-py
addopts = -q
markers =
    gate_contract: unit contract gate
    gate_pre_read: unit pre-read gate
    gate_reader: unit reader gate
    gate_citations: unit citations gate
    gate_no_raw_leak: unit no-raw-leak gate
    gate_bounded_output: unit bounded-output gate
    gate_cancellation: unit cancellation gate
    gate_permissions: unit permissions gate
    gate_no_writes: unit no-writes gate
    gate_capability: unit capability gate
    integration_hermes: opt-in real Hermes integration
    integration_openclaw: opt-in real OpenClaw integration
    eval_luna: opt-in live Luna eval
    benchmark: opt-in benchmark
filterwarnings =
    error::pytest.PytestUnknownMarkWarning
