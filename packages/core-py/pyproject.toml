[build-system]
requires = ["setuptools>=80,<81", "wheel>=0.45,<0.46"]
build-backend = "setuptools.build_meta"

[project]
name = "context-shunt-core"
version = "1.1.0"
description = "Read-only context shunt core: pre-read gate, question-driven reader with truthful provenance, deterministic exact extraction under a disclosure ceiling, a hybrid SQLite/content-addressed snapshot store, signed token accounting and bounded envelopes."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "context-shunt contributors" }]
dependencies = [
  "jsonschema>=4.25,<4.27",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<8.5",
  "ruff>=0.14,<0.15",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# The store DDL is normative and executed at runtime, so it has to ship alongside the
# JSON contracts - a wheel without it cannot open a store.
context_shunt = [
  "contracts/v1/*.json",
  "contracts/v1/**/*.json",
  "contracts/store/*.sql",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
# Must mirror the root pytest.ini: this registry is the one in effect when pytest runs
# from inside the package rather than from the repo root, and two registries that disagree
# let a marker be silently unknown on one path and a gate selector select nothing. The
# PytestUnknownMarkWarning filter below is what keeps them honest - a marker missing here
# is an error, not a warning, so the divergence cannot recur quietly.
markers = [
  "gate_contract", "gate_pre_read", "gate_reader", "gate_citations",
  "gate_no_raw_leak", "gate_bounded_output", "gate_cancellation",
  "gate_permissions", "gate_no_writes", "gate_capability",
  "gate_store", "gate_inspect", "gate_accounting", "gate_artifact_import",
  "gate_legacy_compact",
  "bridge_contract", "shadow_ab",
  "integration_hermes", "integration_openclaw",
  "eval_luna", "benchmark", "benchmark_provider",
]
filterwarnings = [
  "error::DeprecationWarning:context_shunt.*",
  "error::pytest.PytestUnknownMarkWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501"]
