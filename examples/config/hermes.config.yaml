# Example Hermes configuration for context-shunt.
# Merge these keys into ~/.hermes/config.yaml; do not replace the file.

plugins:
  enabled:
    - context-shunt
  entries:
    context-shunt:
      # The reader pins a model, and Hermes gates plugin model overrides per plugin.
      # Without this, `_check_overrides` refuses the override and the reader runs on
      # whatever the host would have picked. That is not silently accepted: the envelope
      # reports what was requested and how strongly the attribution can be believed.
      llm:
        allow_model_override: true
        allowed_models:
          - gpt-5.6-luna
        allow_provider_override: false
        allow_agent_id_override: false
        allow_profile_override: false

      config:
        # Only these roots may become sources. Everything else is UNSAFE_SOURCE.
        workspace_roots:
          - /path/to/your/project

        # Private cache: SQLite authorization metadata plus content-addressed payload
        # files. Keep it outside every workspace root and outside git. Directories 0700,
        # payload files 0600. Handles expire after an hour by default.
        cache_dir: ~/.cache/context-shunt

        # Extra administrator denials, relative globs inside a root. The built-in secret
        # policy (.env, private keys, credential stores) applies regardless.
        denylist:
          - "secrets/*"
          - "**/*.local.yaml"

        # Block oversized and unprovable reads before they run.
        gate_enabled: true

        reader:
          enabled: true

          # Configurable since contract revision 1.1; this is the default. What keeps a
          # substitution from going unnoticed is the envelope's provenance block, not a
          # hardcoded value here.
          model: gpt-5.6-luna

          # Optional. Empty lets the host route.
          provider: ""

          # What to do when the host cannot prove which model answered.
          #   allow_unverified (default) - publish the answer, labelled `unverified`.
          #   require_match             - refuse instead, with PROVENANCE_UNAVAILABLE.
          # On Hermes the facade cannot distinguish a provider report from an echo of the
          # request, so require_match disables the reader entirely. inspect and stats keep
          # working either way; neither touches a model.
          attribution_policy: allow_unverified

          # Availability-only fallback. Never a remedy for a poor-quality answer: the
          # honest remedy for that is a refined question over the same snapshot. Each
          # attempt keeps its own reported provenance, and reaching one sets fallback_used.
          automatic_extract: true
          fallback_max_bytes: 2048 # 1..4096; also bounded by inspect/disclosure limits
          # fallback_chain:
          #   - model: gpt-5.6-luna
          #     provider: openrouter

          # Legacy-compaction: a second, disjoint fallback for a reader failure
          # automatic_extract does not cover (a citation-empty result, or a
          # malformed/partial response). On by default; a ported, deterministic
          # heuristic summary, never exact bytes and never model output. See
          # docs/configuration.md#legacy-compaction-fallback-for-reader-outcomes-automatic-extraction-does-not-cover.
          legacy_compaction: true
          legacy_compaction_max_chars: 16000 # 1000..60000

        # Deterministic exact extraction: zero model calls, 16 KiB per page, and every
        # page charged against a cumulative per-source and per-session disclosure ceiling.
        # Set enabled: false if you would rather no source bytes reach the context at all.
        inspect:
          enabled: true

        # Read-only session accounting. Cannot reset a counter, change retention, reach
        # another session, or reveal content.
        stats:
          enabled: true

        # Optional oversized-tool-result capture. Off (unsupported) by default: turning it
        # on requires an explicit operator attestation that you personally verified your
        # own installed host's transform_tool_result capture-before-truncation ordering -
        # see docs/capability-matrix.md#tool_result_capture-on-hermes-021-what-changed-and-what-did-not
        # and docs/acceptance.md#tool_result_capture-cutover-on-hermes before setting this.
        # `enabled: true` alone changes nothing without the attestation below.
        tool_result_capture:
          enabled: false
          # host_ordering_verified_locally: true

        # Deprecated alias for tool_result_capture, still accepted so an older config file
        # keeps working unchanged. Do not set both to disagreeing values.
        # suma_post_tool:
        #   enabled: false

        # The external-artifact import boundary: adopt an oversized tool result a
        # compactor or spooler already persisted, without the host having to intercept
        # the result. This is the deployable path for oversized *tool output*, and it is
        # not post-tool interception - the mode above stays unsupported either way.
        #
        # Off by default, and enabling it requires saying what it trusts: at least one
        # import root and at least one allowlisted producer manifest schema. An enabled
        # boundary with neither is refused at load rather than defaulting to allow-all.
        # Import roots are a separate allowlist from workspace_roots, canonicalized, and
        # refused if they contain the private cache. Every manifest claim - path, size,
        # digest, media type - is re-proven against the file before a handle exists.
        #
        # artifact_import:
        #   enabled: true
        #   roots:
        #     - /var/lib/your-compactor/artifacts
        #   accepted_manifest_schemas:
        #     - context_shunt.artifact_import.v1

        # Caps may only be narrowed. A wider value is refused at load.
        # limits:
        #   full_read_max_lines: 200
        #   max_answer_bytes: 4096
        #   store_handle_ttl_seconds: 900
        #   disclosure_max_per_source_bytes: 65536

# The reader is also registered as a Hermes auxiliary task, so it shows up in
# `hermes model -> Configure auxiliary models`. Anything you set here wins over the
# plugin's own defaults. "auto" is the host's inherit sentinel, not a literal model id.
#
# auxiliary:
#   context_shunt_reader:
#     provider: auto
#     model: gpt-5.6-luna
#     timeout: 20

# There is no writer key. `writer.enabled: true` is refused at load time rather than
# accepted and ignored.
